services:
  db:
    image: ghcr.io/hh12356/dotpub-mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?读不到这个变量：① backend/.env 里有没有这行；② 命令有没有带 --env-file ./backend/.env}
      MYSQL_DATABASE: DotPub
      MYSQL_USER: dotpub
      MYSQL_PASSWORD: ${DB_PASSWORD:?读不到这个变量：① backend/.env 里有没有这行；② 命令有没有带 --env-file ./backend/.env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    image: ghcr.io/hh12356/dotpub-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_USER: dotpub
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/hh12356/dotpub-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
