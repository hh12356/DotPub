name: Build and Deploy

on:
  push:
    branches: [master]

env:
  REGISTRY: crpi-8dxgsbsc57rw3rfl.cn-hangzhou.personal.cr.aliyuncs.com
  BACKEND_IMAGE: crpi-8dxgsbsc57rw3rfl.cn-hangzhou.personal.cr.aliyuncs.com/dotpub/dotpub-backend
  FRONTEND_IMAGE: crpi-8dxgsbsc57rw3rfl.cn-hangzhou.personal.cr.aliyuncs.com/dotpub/dotpub-frontend
  MYSQL_IMAGE: crpi-8dxgsbsc57rw3rfl.cn-hangzhou.personal.cr.aliyuncs.com/dotpub/mysql:8.4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror mysql:8.4
        run: |
          if docker manifest inspect ${{ env.MYSQL_IMAGE }} > /dev/null 2>&1; then
            echo "already on registry, skipping"
          else
            echo "first time: mirroring mysql:8.4"
            docker pull mysql:8.4
            docker tag mysql:8.4 ${{ env.MYSQL_IMAGE }}
            docker push ${{ env.MYSQL_IMAGE }}
          fi

      - name: Sync compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/dotpub/"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/dotpub

            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file ./backend/.env pull
            docker compose --env-file ./backend/.env up -d

            WEB=$(docker compose --env-file ./backend/.env ps -q web)
            RUNNING=$(docker inspect "$WEB" --format '{{.Config.Image}}')
            EXPECTED="${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

            if [ "$RUNNING" != "$EXPECTED" ]; then
              echo "FAIL: web is running $RUNNING"
              echo "      expected  $EXPECTED"
              exit 1
            fi
            echo "OK: web is running the new image"

            sleep 3
            if curl -fsS -o /dev/null http://127.0.0.1/; then
              echo "OK: homepage reachable"
            else
              echo "FAIL: homepage not reachable"
              exit 1
            fi
