name: Build and Deploy

on:
  push:
    branches: [master]

env:
  BACKEND_IMAGE: ghcr.io/hh12356/dotpub-backend
  FRONTEND_IMAGE: ghcr.io/hh12356/dotpub-frontend
  MYSQL_IMAGE: ghcr.io/hh12356/dotpub-mysql:8.4

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mirror mysql:8.4 to ghcr
        run: |
          if docker manifest inspect ${{ env.MYSQL_IMAGE }} > /dev/null 2>&1; then
            echo "already on ghcr, skipping"
          else
            echo "first time: mirroring mysql:8.4"
            docker pull mysql:8.4
            docker tag mysql:8.4 ${{ env.MYSQL_IMAGE }}
            docker push ${{ env.MYSQL_IMAGE }}
          fi

      - name: Sync compose file to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/dotpub/"


      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/dotpub
            export IMAGE_TAG=${{ github.sha }}
            docker compose --env-file ./backend/.env pull
            docker compose --env-file ./backend/.env up -d
            sleep 5
            if curl -fsS -o /dev/null http://127.0.0.1/; then
              echo "deployed, homepage OK"
            else
              echo "homepage NOT reachable after deploy"
              exit 1
            fi
